name: Deploy to Cloudflare Workers

# Builds and deploys the production Worker whenever `main` updates — e.g. when
# you merge a branch. Also runnable on demand from the Actions tab.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Never run two production deploys at the same time.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          # Stamped into <meta name="build-id"> by BaseLayout, then polled by the
          # verify step below. Without it CI builds stamp "dev" and a deploy that
          # never reached the edge is indistinguishable from a successful one.
          PUBLIC_BUILD_ID: ${{ github.sha }}

      - name: Deploy to Cloudflare Workers
        # Astro 7 / @astrojs/cloudflare v14 emits a self-contained deploy config
        # (main + merged bindings) under dist/server/. Deploy from that, not the
        # root wrangler.jsonc (which no longer carries `main`).
        run: npx wrangler deploy -c dist/server/wrangler.json
        env:
          # Repo → Settings → Secrets and variables → Actions
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # Optional — only needed if your API token can see more than one account
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify the deploy is actually live
        # `wrangler deploy` returns when the upload finishes; Workers static
        # assets take a beat to reach every edge. Poll for this build's stamp so
        # a green check means "live", not merely "uploaded".
        #
        # Two things learned the hard way on this step's first real run:
        #  1. Poll past the CACHE. A plain GET keeps hitting whichever edge copy
        #     the runner's PoP already has, so it can report stale for minutes
        #     after the origin is updated. Bust it with a header AND a query.
        #  2. Do NOT fail the job on timeout. wrangler already confirmed the
        #     upload; anything after that is propagation, not a broken deploy.
        #     The first run red-X'd a deploy that was in fact live — and a CI
        #     failure that doesn't mean failure is worse than no check at all.
        #     Warn loudly, stay green.
        run: |
          for i in $(seq 1 60); do
            if curl -sL --max-time 10 -H 'Cache-Control: no-cache' -H 'Pragma: no-cache' \
                 "https://mannyknows.com/?cb=${{ github.run_id }}-$i" \
                 | grep -q "${{ github.sha }}"; then
              echo "✅ Verified live after $((i * 10))s."
              exit 0
            fi
            sleep 10
          done
          echo "::warning::Deploy succeeded but the edge is still serving an older build after 10 minutes. This is propagation, not a failed deploy — check https://mannyknows.com if it persists."

      - name: Ping IndexNow
        # Tells Bing, Yandex, Seznam, Naver and Yep to re-crawl. Google does not
        # participate in IndexNow — it still goes by the sitemap + Search Console.
        # Runs after a successful deploy so the pages being announced are live.
        # The script never fails the job; a missed ping is not a broken deploy.
        run: node scripts/indexnow.mjs
